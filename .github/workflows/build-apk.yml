name: Generate Audio and Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**.dart'
      - 'assets/data/**'
      - 'scripts/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  build:
    name: Generate voices, verify assets, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-audio.txt

      - name: Install audio generator
        run: python -m pip install --upgrade pip && pip install -r requirements-audio.txt

      - name: Generate every lesson and rhyme audio
        run: python scripts/generate_audio.py

      - name: Verify all generated MP3 files before Flutter build
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('assets/data/lessons.json').read_text(encoding='utf-8'))
          expected=[Path('assets/audio')/x['language']/x['audio'] for x in data['lessons']]
          expected += [Path('assets/audio/rhymes')/x['audio'] for x in data['rhymes']]
          missing=[str(p) for p in expected if not p.is_file() or p.stat().st_size <= 1000]
          print(f'Expected audio files: {len(expected)}')
          if missing:
              raise SystemExit('Audio verification failed:\n'+'\n'.join(missing))
          print('All generated audio files exist and are non-empty.')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android project files exist
        run: flutter create --platforms=android --org com.mehadihasan --project-name amar_prothom_pathshala .

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check Dart source
        run: flutter analyze

      - name: Build release APK with bundled audio
        run: flutter build apk --release

      - name: Verify audio files are inside the APK
        run: python scripts/verify_audio.py build/app/outputs/flutter-apk/app-release.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: amar-prothom-pathshala-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
