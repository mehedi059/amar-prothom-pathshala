name: amar_prothom_pathshala
description: Offline-first Bangla learning app for children aged 3-6.
publish_to: 'none'
version: 2.0.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/lessons.json
    - assets/audio/bn/
    - assets/audio/en/
    - assets/audio/ar/
    - assets/audio/rhymes/
